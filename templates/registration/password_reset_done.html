{% extends "base.html" %}
{% block title %}E-mail envoyé{% endblock %}
{% block content %}
<div class="login-page">
    <div class="card login-card">
        <div class="card-header">
            <span class="badge bg-success p-3 mb-2"><i class="bi bi-envelope-check fs-4"></i></span>
            <h5 class="fw-bold mb-1">E-mail envoyé</h5>
        </div>
        <div class="card-body text-center">
            <p class="mb-3">Si un compte existe avec cette adresse, un lien de réinitialisation vient d'être envoyé. Vérifiez votre boîte de réception.</p>
            <a href="{% url 'connexion' %}" class="btn btn-outline-primary"><i class="bi bi-arrow-left"></i> Retour à la connexion</a>
        </div>
    </div>
</div>
{% endblock %}
