{% extends "base.html" %}
{% block title %}Mot de passe réinitialisé{% endblock %}
{% block content %}
<div class="login-page">
    <div class="card login-card">
        <div class="card-header">
            <span class="badge bg-success rounded-3 p-3 mb-2"><i class="bi bi-check-lg fs-4"></i></span>
            <h5 class="fw-bold mb-1">Mot de passe réinitialisé</h5>
        </div>
        <div class="card-body text-center">
            <p class="mb-3">Votre mot de passe a bien été modifié. Vous pouvez maintenant vous connecter.</p>
            <a href="{% url 'connexion' %}" class="btn btn-primary">Se connecter</a>
        </div>
    </div>
</div>
{% endblock %}
