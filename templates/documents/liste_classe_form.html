{% extends "base.html" %}
{% block title %}Liste de classe{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-lg-4 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="page-header">
                <h1 class="page-title mb-0">Liste de classe / effectifs</h1>
                <p class="text-muted mb-0 mt-1">Avec filtres par sexe et statut de paiement (UC-37).</p>
            </div>
            <div class="card">
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3"><label class="form-label">Classe</label>{{ form.classe }}</div>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Sexe</label>{{ form.sexe }}</div>
                            <div class="col-md-6"><label class="form-label">Statut de paiement</label>{{ form.statut_paiement }}</div>
                        </div>
                        <button class="btn btn-primary w-100 mt-3"><i class="bi bi-file-earmark-pdf me-1"></i>Générer le PDF</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
