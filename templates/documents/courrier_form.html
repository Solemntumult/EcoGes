{% extends "base.html" %}
{% block title %}Courriers types{% endblock %}

{% block content %}
<div class="container-fluid px-3 px-lg-4 py-4">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="page-header">
                <h1 class="mb-0"><i class="bi bi-envelope me-2 text-primary"></i>Courriers types</h1>
                <p class="text-muted mb-0 mt-1">Convocation de parents, avertissement, mise en demeure (UC-38).</p>
            </div>
            <div class="card">
                <div class="card-body">
                    <form method="post" novalidate>
                        {% csrf_token %}
                        <div class="mb-3"><label class="form-label">Élève</label>{{ form.inscription }}</div>
                        <div class="mb-3"><label class="form-label">Type de courrier</label>{{ form.type_courrier }}</div>
                        <div class="mb-3"><label class="form-label">Motif (optionnel)</label>{{ form.motif }}</div>
                        <button class="btn btn-primary w-100"><i class="bi bi-file-earmark-pdf me-1"></i>Générer le PDF</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
